name: Compilar APK Android (Control de Asistencia)

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "kiosco-biometrico.html"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm ci

      # El kiosco biometrico (raiz del repo) es la pantalla que se instala en la
      # tablet -- se copia como index.html de la app movil. face-api.js y sus
      # modelos se cargan desde CDN en tiempo de ejecucion (no se empaquetan):
      # Android/Capacitor corrompe los shards binarios grandes servidos como
      # asset local del WebView, y el kiosco ya requiere internet para Supabase.
      - name: Sincronizar app web con Capacitor
        run: |
          cp ../kiosco-biometrico.html www/index.html
          cp ../manifest.json www/manifest.json
          cp -r ../icons www/icons
          npx cap sync android

      - name: Compilar APK (debug)
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: asistencia-adecco-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
