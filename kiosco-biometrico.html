<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ADECCO · Control de Asistencia (Reconocimiento Facial)</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0B0D12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Asistencia">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0D12; --bg-soft:#12151C; --panel:#FFFFFF; --panel-alt:#F5F6F8; --border:#232733;
    --text:#EDEFF3; --text-dark:#1A1D23; --muted:#7C8496; --text-soft:#4B5563;
    --red:#E31E24; --red-dark:#B9151A; --red-tint:#FDECEC; --red-glow:rgba(227,30,36,.35);
    --green:#16A34A; --green-2:#22C55E; --green-tint:#E9F9EF; --green-glow:rgba(34,197,94,.35);
    --amber:#F59E0B; --amber-2:#FFB238; --amber-tint:#FEF3E2; --amber-glow:rgba(245,158,11,.35);
    --shadow:0 2px 10px rgba(0,0,0,.3);
    --shadow-btn:0 10px 26px -6px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit;touch-action:manipulation;cursor:pointer;}
  [hidden]{display:none!important;}
  svg{display:block;}

  #app{height:100dvh;height:100vh;display:flex;flex-direction:column;overflow:hidden;position:relative;
    padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);}

  .topbar-red{height:4px;background:linear-gradient(90deg,var(--red-dark),var(--red),var(--red-dark));flex-shrink:0;}

  header{display:flex;align-items:center;gap:12px;padding:14px 22px;flex-shrink:0;background:var(--bg-soft);border-bottom:1px solid var(--border);}
  header .logo-wrap{width:40px;height:40px;flex-shrink:0;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
  header .logo-wrap img{width:28px;height:28px;}
  header .brand{display:flex;flex-direction:column;line-height:1.2;}
  header .brand b{font-size:18px;letter-spacing:.03em;color:#fff;font-weight:800;}
  header .brand span{font-size:12px;color:var(--muted);font-weight:500;}
  header .status-cluster{margin-left:auto;display:flex;align-items:center;gap:14px;}
  .conn-pill{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.02em;text-transform:uppercase;}
  .conn-dot{width:7px;height:7px;border-radius:50%;background:var(--green-2);box-shadow:0 0 0 3px var(--green-glow);}
  .conn-dot.off{background:var(--red);box-shadow:0 0 0 3px var(--red-glow);animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.35;}}
  header .clock{font-size:16px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;font-family:'IBM Plex Mono',monospace;}

  /* ---------------- Pantalla de inicio: 3 botones gigantes ---------------- */
  #home-view{
    flex:1;min-height:0;display:flex;flex-direction:column;padding:18px;gap:16px;position:relative;
    background:
      radial-gradient(1100px 500px at 85% -10%, rgba(227,30,36,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(34,197,94,.08), transparent 60%),
      var(--bg);
  }
  .mega-btn{
    flex:1;border:none;border-radius:26px;color:#fff;display:flex;flex-direction:row;position:relative;overflow:hidden;
    align-items:center;justify-content:flex-start;gap:20px;padding:0 30px;box-shadow:var(--shadow-btn);
    transition:transform .1s ease, filter .1s ease;
  }
  .mega-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 40%);pointer-events:none;}
  .mega-btn:active{transform:scale(.97);filter:brightness(.92);}
  .mega-btn .ico-wrap{
    width:clamp(56px,8vw,78px);height:clamp(56px,8vw,78px);border-radius:50%;background:rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;backdrop-filter:blur(2px);
  }
  .mega-btn .ico-wrap svg{width:52%;height:52%;}
  .mega-btn .label{display:flex;flex-direction:column;align-items:flex-start;gap:2px;position:relative;z-index:1;}
  .mega-btn .label b{font-size:clamp(24px,4.2vw,36px);letter-spacing:.02em;font-weight:800;}
  .mega-btn .label span{font-size:clamp(12px,2vw,15px);opacity:.85;font-weight:500;}
  .mega-btn .chevron{margin-left:auto;opacity:.55;width:22px;height:22px;flex-shrink:0;position:relative;z-index:1;}
  .mega-btn.ingreso{background:linear-gradient(135deg,var(--green-2),var(--green));box-shadow:var(--shadow-btn),0 0 0 1px rgba(255,255,255,.06) inset;}
  .mega-btn.almuerzo{background:linear-gradient(135deg,var(--amber-2),var(--amber));box-shadow:var(--shadow-btn),0 0 0 1px rgba(255,255,255,.06) inset;}
  .mega-btn.salida{background:linear-gradient(135deg,#ff5257,var(--red));box-shadow:var(--shadow-btn),0 0 0 1px rgba(255,255,255,.06) inset;}
  .mega-btn{animation:btn-in .5s cubic-bezier(.2,.8,.2,1) backwards;}
  .mega-btn.ingreso{animation-delay:.05s;}
  .mega-btn.almuerzo{animation-delay:.15s;}
  .mega-btn.salida{animation-delay:.25s;}
  @keyframes btn-in{from{opacity:0;transform:translateY(18px) scale(.98);}to{opacity:1;transform:none;}}

  .enroll-fab{position:fixed;left:14px;bottom:14px;z-index:5;display:flex;align-items:center;gap:7px;
    padding:10px 16px;border-radius:999px;border:1px solid var(--border);background:rgba(18,21,28,.85);
    backdrop-filter:blur(6px);color:var(--muted);font-size:12px;font-weight:700;box-shadow:var(--shadow);}
  .enroll-fab svg{width:15px;height:15px;flex-shrink:0;}
  .enroll-fab:active{filter:brightness(1.3);}

  .kiosk-footer{position:fixed;right:12px;bottom:10px;z-index:4;font-size:10px;color:#3E4658;font-family:'IBM Plex Mono',monospace;letter-spacing:.03em;}

  /* ---------------- Salvapantallas (reposo) ---------------- */
  #idle-screen{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;background:var(--panel);overflow:hidden;cursor:pointer;}
  #idle-screen.show{display:flex;}
  #idle-screen .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.16;}
  #idle-screen .blob.b1{width:520px;height:520px;background:var(--red);top:-180px;left:-160px;animation:drift1 16s ease-in-out infinite alternate;}
  #idle-screen .blob.b2{width:460px;height:460px;background:var(--red-tint);bottom:-180px;right:-140px;animation:drift2 20s ease-in-out infinite alternate;}
  #idle-screen .blob.b3{width:360px;height:360px;background:#F3D6D7;top:40%;left:60%;animation:drift1 24s ease-in-out infinite alternate-reverse;}
  @keyframes drift1{from{transform:translate(0,0);}to{transform:translate(60px,40px);}}
  @keyframes drift2{from{transform:translate(0,0);}to{transform:translate(-50px,-30px);}}
  #idle-screen .idle-logo{position:relative;z-index:1;}
  #idle-screen .idle-logo img{height:clamp(64px,9vh,110px);width:auto;display:block;}
  #idle-screen .idle-clock{font-family:'IBM Plex Mono',monospace;font-size:clamp(48px,9vw,104px);font-weight:600;letter-spacing:.01em;
    color:var(--text-dark);line-height:1;position:relative;z-index:1;white-space:nowrap;}
  #idle-screen .idle-date{font-size:clamp(15px,2vw,19px);color:var(--text-soft);text-transform:capitalize;position:relative;z-index:1;}
  #idle-screen .idle-brand{font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--red);text-transform:uppercase;position:relative;z-index:1;}
  #idle-screen .idle-tap{
    margin-top:20px;display:flex;align-items:center;gap:10px;padding:12px 22px;border-radius:999px;
    background:var(--red-tint);border:1px solid #F6C7C8;color:var(--red-dark);font-size:14px;font-weight:700;
    position:relative;z-index:1;animation:tap-pulse 1.8s ease-in-out infinite;
  }
  @keyframes tap-pulse{0%,100%{opacity:.75;transform:scale(1);}50%{opacity:1;transform:scale(1.04);}}
  #idle-screen .idle-tap svg{width:18px;height:18px;}
  #idle-screen .idle-right{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;z-index:1;}

  /* Tablet en horizontal: la marca a la izquierda, reloj/fecha a la derecha,
     para usar el ancho en vez de dejar todo apretado en una columna angosta. */
  @media (orientation:landscape) and (min-width:640px){
    #idle-screen{flex-direction:row;justify-content:center;gap:clamp(48px,8vw,120px);}
    #idle-screen .idle-logo img{height:clamp(70px,12vh,130px);}
    #idle-screen .idle-right{align-items:flex-start;}
    #idle-screen .idle-tap{margin-top:6px;}
  }

  #debug-banner{position:fixed;left:10px;right:10px;bottom:64px;z-index:50;background:#1a1d23;color:#fff;
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.5;padding:10px 12px;border-radius:10px;
    box-shadow:var(--shadow);display:none;max-height:30vh;overflow:auto;border:1px solid var(--border);}
  #debug-banner.show{display:block;}
  #debug-banner b{color:#ff8a8a;}

  /* ---------------- Pantalla de escaneo (a pantalla completa) ---------------- */
  #scan-view{position:fixed;inset:0;z-index:15;display:none;flex-direction:column;
    background:radial-gradient(1200px 700px at 50% -10%, #171b24, #0B0D12 60%);}
  #scan-view.show{display:flex;}
  .scan-topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;flex-shrink:0;}
  .scan-topbar .accion-tag{color:#fff;font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;
    display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.08);padding:8px 16px;border-radius:999px;}
  .scan-cancel{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:rgba(255,255,255,.06);color:#fff;
    display:flex;align-items:center;justify-content:center;}
  .scan-cancel svg{width:18px;height:18px;}
  .scan-body{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:0 18px 24px;}

  .cam-frame-wrap{position:relative;width:min(78vw,340px);aspect-ratio:3/4;}
  .cam-frame-wrap::before{
    content:"";position:absolute;inset:-10px;border-radius:34px;border:2px solid rgba(255,255,255,.14);
    animation:pulse-ring 2.2s ease-in-out infinite;
  }
  @keyframes pulse-ring{0%,100%{transform:scale(1);opacity:.55;}50%{transform:scale(1.03);opacity:.15;}}
  #cam-unit{position:absolute;inset:0;border-radius:26px;overflow:hidden;background:#05060a;
    box-shadow:0 0 0 1px rgba(255,255,255,.1), 0 20px 50px -12px rgba(0,0,0,.6);}
  #cam-unit video, #cam-unit canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}

  /* Silueta guía de rostro -- capa puramente visual encima del video, no
     interviene en el reconocimiento (face-api.js lee el <video> directo). */
  .face-guide{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;pointer-events:none;}
  .face-guide svg{width:82%;height:auto;filter:drop-shadow(0 2px 10px rgba(0,0,0,.4));}
  #face-oval{fill:none;stroke-width:2.5;transition:stroke .15s ease;}

  .scan-hint-row{display:flex;align-items:center;justify-content:center;gap:10px;}
  .scan-hint{color:#fff;font-size:15.5px;font-weight:700;text-align:center;min-height:22px;}
  .scan-dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1.1s infinite;flex-shrink:0;}

  .result-card{width:min(80vw,360px);background:var(--panel);border-radius:22px;padding:26px 24px;box-shadow:0 24px 60px -12px rgba(0,0,0,.55);text-align:center;color:var(--text-dark);}
  .result-card h2{margin:0 0 4px;font-size:21px;color:var(--text-dark);}
  .result-card p{margin:0;font-size:13px;color:var(--muted);}
  .result-card .turno-info{margin-top:8px;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;display:inline-block;background:var(--panel-alt);color:var(--text-soft);}
  .result-card .turno-info.warn{background:var(--amber-tint);color:#8a5a06;}
  .result-feedback{margin-top:14px;padding:13px 14px;border-radius:14px;font-size:15px;font-weight:700;}
  .result-feedback.info{background:var(--panel-alt);color:var(--text-soft);}
  .result-feedback.success{background:var(--green-tint);color:#0d6b34;}
  .result-feedback.error{background:var(--red-tint);color:var(--red-dark);}

  /* ---------------- Modal de registro biometrico ---------------- */
  #enroll-modal{position:fixed;inset:0;z-index:20;background:rgba(6,7,10,.72);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;padding:16px;}
  #enroll-modal.show{display:flex;}
  /* Horizontal por defecto (la tablet queda fija en landscape): cámara a la
     izquierda con ancho fijo, formulario+botones a la derecha SIEMPRE
     visibles (nunca dependen de hacer scroll para llegar al botón). */
  .enroll-card{width:min(94vw,760px);max-height:92vh;overflow:auto;background:var(--bg-soft);border:1px solid var(--border);border-radius:20px;
    padding:22px;box-shadow:0 30px 70px -15px rgba(0,0,0,.6);color:var(--text);display:flex;gap:22px;align-items:stretch;}
  .enroll-col-cam{flex:0 0 210px;}
  .enroll-col-form{flex:1;min-width:0;display:flex;flex-direction:column;}
  .enroll-card h3{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:8px;}
  .enroll-card h3 svg{width:19px;height:19px;color:var(--red);}
  .enroll-card p.hint{margin:0 0 14px;font-size:12.5px;color:var(--muted);}
  .enroll-card label{display:block;font-size:11px;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
  .enroll-card input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);font-size:16px;background:#0d1015;color:var(--text);}
  .enroll-card input:focus{outline:none;border-color:var(--red);}
  #enroll-cam-slot{position:relative;width:100%;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:#05060a;border:1px solid var(--border);}
  .enroll-row{display:flex;gap:8px;margin-top:14px;}
  .enroll-row-actions{margin-top:auto;padding-top:14px;}

  /* Pantalla angosta/portrait (navegador normal, no la tablet fija en
     horizontal): las columnas se apilan para no quedar apretadas. */
  @media (max-width:640px), (orientation:portrait){
    .enroll-card{flex-direction:column;}
    .enroll-col-cam{flex:0 0 auto;}
  }
  .btn{padding:13px 14px;border-radius:11px;border:none;font-size:14px;font-weight:700;flex:1;}
  .btn-primary{background:linear-gradient(135deg,#ff4b50,var(--red));color:#fff;}
  .btn-primary:disabled{opacity:.4;}
  .btn-ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--border);}
  .enroll-status{margin-top:12px;font-size:13.5px;font-weight:600;min-height:18px;}
  .enroll-status.ok{color:var(--green-2);}
  .enroll-status.bad{color:#ff8a8a;}
  .enroll-info{font-size:13px;color:var(--muted);margin-top:6px;}

  /* Fila horizontal solo en pantallas anchas Y en orientacion horizontal
     (tablet/monitor apaisado); en un tablet parado en la entrada (portrait,
     el caso mas comun de kiosko) se quedan apiladas para que cada boton
     sea grande y facil de tocar. */
  @media (min-width:760px) and (min-aspect-ratio: 1/1){
    #home-view{flex-direction:row;}
    .mega-btn{flex-direction:column;justify-content:center;text-align:center;gap:14px;padding:20px;}
    .mega-btn .label{align-items:center;}
    .mega-btn .chevron{display:none;}
  }
</style>
</head>
<body>

<div id="app">
  <div class="topbar-red"></div>
  <header>
    <div class="logo-wrap"><img src="icons/icon-512.png" alt="Adecco"></div>
    <div class="brand"><b>ADECCO</b><span>Control de Asistencia · Reconocimiento facial</span></div>
    <div class="status-cluster">
      <div class="conn-pill"><span class="conn-dot" id="conn-dot"></span><span id="conn-label">En línea</span></div>
      <div class="clock" id="clock">--:--</div>
    </div>
  </header>

  <main id="home-view">
    <button class="mega-btn ingreso" id="btn-home-ingreso" type="button">
      <span class="ico-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h5a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-5"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
      </span>
      <span class="label"><b>INGRESO</b><span>Marcar llegada</span></span>
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button class="mega-btn almuerzo" id="btn-home-almuerzo" type="button">
      <span class="ico-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v7a2 2 0 0 0 2 2v11"/><path d="M8 2v6M11 2v6"/><path d="M17 2c-1.5 0-3 1.5-3 4.5S15.5 12 17 12v10"/></svg>
      </span>
      <span class="label"><b>ALMUERZO</b><span>Salida / retorno</span></span>
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button class="mega-btn salida" id="btn-home-salida" type="button">
      <span class="ico-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3H5a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h5"/><path d="M14 17l5-5-5-5"/><path d="M19 12H8"/></svg>
      </span>
      <span class="label"><b>SALIDA</b><span>Marcar fin de turno</span></span>
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </main>

  <button class="enroll-fab" id="btn-enroll-open" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a5 5 0 0 0-5 5v2a5 5 0 0 0 10 0V7a5 5 0 0 0-5-5Z"/><path d="M8 14v1a4 4 0 0 0 8 0v-1M5 12v2a7 7 0 0 0 14 0v-2M12 21v-4"/></svg>
    Registro biométrico
  </button>
  <div class="kiosk-footer">ADECCO · Control de Asistencia v1.0</div>
  <div id="debug-banner"></div>

/* Captura errores que de otro modo solo saldrian en la consola del
   navegador (inutil en una tablet real) -- los muestra en pantalla
   para poder diagnosticar sin cable USB ni Chrome DevTools. */
const debugBanner = document.getElementById("debug-banner");
function mostrarErrorGlobal(origen, err){
  const msg = (err && err.message) ? err.message : String(err);
  debugBanner.innerHTML += `<div><b>[${origen}]</b> ${msg}</div>`;
  debugBanner.classList.add("show");
}
window.addEventListener("error", (e) => mostrarErrorGlobal("error", e.error || e.message));
window.addEventListener("unhandledrejection", (e) => mostrarErrorGlobal("promesa", e.reason));

/* Indicador de conexion -- util en un kiosko de produccion para que el
   personal de piso vea de un vistazo si el internet se cayo (sin
   internet no se puede identificar a nadie ni registrar marcaciones). */
const connDot = document.getElementById("conn-dot");
const connLabel = document.getElementById("conn-label");
function actualizarConexion(){
  const online = navigator.onLine;
  connDot.classList.toggle("off", !online);
  connLabel.textContent = online ? "En línea" : "Sin conexión";
}
window.addEventListener("online", actualizarConexion);
window.addEventListener("offline", actualizarConexion);
actualizarConexion();

// Modelos servidos desde CDN (no empaquetados en el APK): Capacitor/Android
// corrompe archivos binarios grandes leidos como asset local del WebView
// (el shard de 4MB de face_recognition_model llegaba truncado). El kiosco
// ya requiere internet para Supabase, asi que no es una dependencia nueva.
const MODEL_URL = "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js/weights";
const FOTO_BUCKET = "asis-fotos";
const DISPOSITIVO = "kiosco-biometrico";

const RECOGNIZE_THRESHOLD = 0.5;
const RECOGNIZE_INTERVAL_MS = 350;
const STABLE_FRAMES_NEEDED = 3;
const ENROLL_SAMPLES = 3;
const RESET_DESPUES_MS = 3500;

const TURNO_VENTANAS = {
  "MAÑANA": { desde: "06:00", hasta: "08:15", label: "6:00 a.m. – 8:15 a.m." },
  "TARDE":  { desde: "12:00", hasta: "13:15", label: "12:00 p.m. – 1:15 p.m." },
  "NOCHE":  { desde: "20:00", hasta: "22:15", label: "8:00 p.m. – 10:15 p.m." },
};
const ACCION_INFO = {
  ingreso:  { label: "Ingreso",  tag: "🟢 INGRESO" },
  almuerzo: { label: "Almuerzo", tag: "🍽️ ALMUERZO" },
  salida:   { label: "Salida",   tag: "🔴 SALIDA" },
};
const TIPO_LABEL = { ingreso: "Ingreso", almuerzo_inicio: "Salida a almuerzo", almuerzo_fin: "Retorno de almuerzo", salida: "Salida" };
const ERROR_MSGS = {
  DNI_NO_ENCONTRADO: "No encontramos ese rostro en el roster de colaboradores.",
  COLABORADOR_INACTIVO: "Este colaborador figura como inactivo.",
  FALTA_INGRESO: "Debes marcar Ingreso antes.",
  FALTA_INICIO_ALMUERZO: "Debes marcar Salida a almuerzo antes.",
  YA_REGISTRADO: "Esa marcación ya fue registrada hoy.",
  TIPO_INVALIDO: "Tipo de marcación inválido.",
  FOTO_REQUERIDA: "La foto es obligatoria para Ingreso y Salida.",
  EMBEDDING_INVALIDO: "No se pudo procesar el rostro capturado.",
};
function humanError(err){
  const code = (err && err.message) ? err.message.replace(/^.*?:\s*/, "").trim() : "";
  return ERROR_MSGS[code] || "No se pudo completar la operación. Intenta de nuevo.";
}
function fmtHora(iso){
  return new Date(iso).toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit", hour12: false });
}
function horaActualHHMM(){
  const d = new Date();
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function dentroDeVentana(turno){
  const v = TURNO_VENTANAS[(turno || "").trim().toUpperCase()];
  if(!v) return null;
  const ahora = horaActualHHMM();
  return { ...v, ok: ahora >= v.desde && ahora <= v.hasta };
}

/* ---------------- Salvapantallas (reposo tras inactividad) ---------------- */
const idleScreen = document.getElementById("idle-screen");
const idleClockEl = document.getElementById("idle-clock");
const idleDateEl = document.getElementById("idle-date");
const IDLE_TIMEOUT_MS = 25000;
let idleTimer = null;

setInterval(() => {
  const ahora = new Date();
  idleClockEl.textContent = ahora.toLocaleTimeString("es-PE", { hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false });
  idleDateEl.textContent = ahora.toLocaleDateString("es-PE", { weekday:"long", day:"numeric", month:"long" });
}, 1000);

function ocultarIdle(){ idleScreen.classList.remove("show"); }
function mostrarIdleSiCorresponde(){
  // No interrumpir un escaneo o un enrolamiento en curso -- solo aplica en el inicio.
  if(scanView.classList.contains("show") || enrollModal.classList.contains("show")){
    idleTimer = setTimeout(mostrarIdleSiCorresponde, IDLE_TIMEOUT_MS);
    return;
  }
  idleScreen.classList.add("show");
}
function reiniciarIdleTimer(){
  clearTimeout(idleTimer);
  idleTimer = setTimeout(mostrarIdleSiCorresponde, IDLE_TIMEOUT_MS);
}
/* Solo reinicia el conteo aquí -- NO oculta el salvapantallas en este
   listener. Ocultarlo ya en el pointerdown (antes de que el toque
   termine) dejaba expuesto el botón de abajo, así que el click que
   sigue (mismo gesto) le llegaba a Ingreso/Almuerzo/Salida en vez de
   solo cerrar el salvapantallas -- "atravesaba" la pantalla. */
["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, reiniciarIdleTimer, { passive: true }));
/* El salvapantallas se cierra con su propio click, consumiendo el
   gesto completo (down + up sobre el mismo elemento), así nunca
   queda expuesto un botón de marcación a mitad de un toque. */
idleScreen.addEventListener("click", (e) => {
  e.stopPropagation();
  ocultarIdle();
  reiniciarIdleTimer();
});
reiniciarIdleTimer();

/* Vibracion corta al confirmar una marcacion -- confirmacion tactil,
   no todos los dispositivos/webviews lo soportan asi que es best-effort. */
function vibrarConfirmacion(){
  try{ if(navigator.vibrate) navigator.vibrate(70); }catch(e){}
}

let rostrosDB = [];
let faceMatcher = null;
let modelosListos = false;
let camaraStream = null;
let scanning = false;      // el loop de reconocimiento esta corriendo
let procesando = false;    // ya se encontro match y se esta marcando (ignora nuevos frames)
let accionActual = null;
let stableDni = null, stableCount = 0;
let recognizeTimer = null;

async function cargarModelos(){
  await Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
  ]);
  modelosListos = true;
}

async function cargarRostros(){
  const { data, error } = await sb.rpc("asis_rostros_listar");
  if(error){ console.error("asis_rostros_listar", error); return; }
  rostrosDB = (data || []).map(r => ({ dni: r.dni, nombre: r.nombre, embedding: new Float32Array(r.embedding) }));
  faceMatcher = rostrosDB.length
    ? new faceapi.FaceMatcher(rostrosDB.map(r => new faceapi.LabeledFaceDescriptors(r.dni, [r.embedding])), RECOGNIZE_THRESHOLD)
    : null;
}

async function iniciarCamara(){
  if(camaraStream) return;
  camaraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 640, height: 480 }, audio: false });
  video.srcObject = camaraStream;
  await new Promise(res => video.onloadedmetadata = res);
  overlayCanvas.width = video.videoWidth;
  overlayCanvas.height = video.videoHeight;
}
function detenerCamara(){
  if(camaraStream){ camaraStream.getTracks().forEach(t => t.stop()); camaraStream = null; }
  video.srcObject = null;
}

async function detectarUnaVez(){
  return faceapi
    .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 }))
    .withFaceLandmarks()
    .withFaceDescriptor();
}
/* Antes dibujaba un rectángulo en overlay-canvas siguiendo la cara
   detectada; ahora en vez de eso colorea el óvalo guía fijo (mismo
   nombre/firma para no tocar cada punto donde se llama). */
function dibujarCaja(box, color){
  const oval = document.getElementById("face-oval");
  if(!oval) return;
  if(!box){
    oval.setAttribute("stroke", "rgba(255,255,255,.55)");
    oval.setAttribute("stroke-dasharray", "6 7");
  }else{
    oval.setAttribute("stroke", color);
    oval.setAttribute("stroke-dasharray", "none");
  }
}

/* ---------------- Flujo: elegir accion -> escanear -> resultado ---------------- */

async function abrirScan(accion){
  accionActual = accion;
  accionTag.textContent = ACCION_INFO[accion].tag;
  resultCard.hidden = true;
  resultFeedbackEl.hidden = true;
  camFrameWrap.appendChild(camUnit); // por si quedo movido dentro del modal de enrolamiento
  camUnit.hidden = false;
  camFrameWrap.hidden = false;
  setHint(modelosListos ? "Mira a la cámara para identificarte…" : "Cargando modelos…");
  scanView.classList.add("show");
  stableDni = null; stableCount = 0;
  procesando = false;

  try{
    if(!modelosListos){
      setHint("Cargando modelos de reconocimiento…");
      await cargarModelos();
    }
    setHint("Solicitando acceso a la cámara…");
    await iniciarCamara();
    dibujarCaja(null); // óvalo guía limpio (por si quedó en rojo/verde de un intento anterior)
  }catch(err){
    console.error(err);
    setHint("No se pudo iniciar: " + (err && err.message ? err.message : err));
    return;
  }
  setHint("Mira a la cámara para identificarte…");
  scanning = true;
  loopReconocer();
}

function cerrarScan(){
  scanning = false;
  clearTimeout(recognizeTimer);
  detenerCamara();
  scanView.classList.remove("show");
  accionActual = null;
}

function setHint(text){ scanHint.textContent = text; }

async function loopReconocer(){
  if(!scanning) return;
  if(procesando){ recognizeTimer = setTimeout(loopReconocer, RECOGNIZE_INTERVAL_MS); return; }
  try{
    const det = await detectarUnaVez();
    if(!det){
      dibujarCaja(null);
      stableDni = null; stableCount = 0;
      setHint("Buscando rostro…");
    }else if(!faceMatcher){
      dibujarCaja(det.detection.box, "#999");
      setHint("No hay colaboradores enrolados. Usa Registro biométrico.");
    }else{
      const match = faceMatcher.findBestMatch(det.descriptor);
      const conocido = match.label !== "unknown";
      dibujarCaja(det.detection.box, conocido ? "#16A34A" : "#E31E24");
      if(!conocido){
        stableDni = null; stableCount = 0;
        setHint("Rostro no reconocido.");
      }else{
        stableDni === match.label ? stableCount++ : (stableDni = match.label, stableCount = 1);
        setHint(`Identificando… (${Math.min(stableCount, STABLE_FRAMES_NEEDED)}/${STABLE_FRAMES_NEEDED})`);
        if(stableCount >= STABLE_FRAMES_NEEDED){
          procesando = true;
          await procesarIdentidad(stableDni);
        }
      }
    }
  }catch(e){ console.error(e); }
  recognizeTimer = setTimeout(loopReconocer, RECOGNIZE_INTERVAL_MS);
}

async function procesarIdentidad(dni){
  setHint("¡Listo! Verificando…");
  const { data, error } = await sb.rpc("asis_buscar_dni", { p_dni: dni });
  if(error){
    setHint(humanError(error));
    procesando = false; stableDni = null; stableCount = 0;
    return;
  }

  camFrameWrap.hidden = true;
  resultCard.hidden = false;
  resultNombreEl.textContent = data.nombre;
  resultMetaEl.textContent = [data.puesto, data.area].filter(Boolean).join(" · ") || "—";

  const tipos = (data.marcas_hoy || []).map(m => m.tipo);
  let tipoReal = null;
  if(accionActual === "ingreso") tipoReal = "ingreso";
  else if(accionActual === "salida") tipoReal = "salida";
  else if(accionActual === "almuerzo") tipoReal = !tipos.includes("almuerzo_inicio") ? "almuerzo_inicio" : (!tipos.includes("almuerzo_fin") ? "almuerzo_fin" : null);

  const ventana = dentroDeVentana(data.turno);
  if(ventana){
    const fueraEnIngreso = tipoReal === "ingreso" && !ventana.ok;
    resultTurnoInfoEl.hidden = false;
    resultTurnoInfoEl.textContent = `Turno ${data.turno} · Ingreso ${ventana.label}` + (fueraEnIngreso ? " · fuera de horario" : "");
    resultTurnoInfoEl.classList.toggle("warn", fueraEnIngreso);
  }else{
    resultTurnoInfoEl.hidden = true;
  }

  if(!tipoReal){
    mostrarFeedback("Ya completaste tu almuerzo de hoy.", "error");
    setTimeout(volverAInicio, RESET_DESPUES_MS);
    return;
  }
  await marcarAsistencia(data.dni, tipoReal);
}

function capturarFrameJPEG(){
  const canvas = document.createElement("canvas");
  const MAX_W = 480;
  const scale = Math.min(1, MAX_W / video.videoWidth);
  canvas.width = Math.round(video.videoWidth * scale);
  canvas.height = Math.round(video.videoHeight * scale);
  const ctx = canvas.getContext("2d");
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  return new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.6));
}
async function subirFoto(blob, dni, tipo){
  try{
    const path = (new Date().toISOString().slice(0,10)) + "/" + dni + "-" + tipo + "-" + Date.now() + ".jpg";
    const { error } = await sb.storage.from(FOTO_BUCKET).upload(path, blob, { contentType: "image/jpeg", upsert: false });
    if(error) return null;
    return path;
  }catch(e){ return null; }
}
function obtenerGeo(){
  return new Promise(resolve => {
    if(!navigator.geolocation) return resolve({ lat: null, lng: null });
    let done = false;
    const finish = (v) => { if(!done){ done = true; resolve(v); } };
    navigator.geolocation.getCurrentPosition(
      pos => finish({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      () => finish({ lat: null, lng: null }),
      { timeout: 1200 }
    );
    setTimeout(() => finish({ lat: null, lng: null }), 1200);
  });
}
function mostrarFeedback(text, kind){
  resultFeedbackEl.hidden = false;
  resultFeedbackEl.textContent = text;
  resultFeedbackEl.className = "result-feedback " + kind;
}

async function marcarAsistencia(dni, tipoReal){
  mostrarFeedback("Registrando…", "info");
  let fotoPath = null;
  if(tipoReal === "ingreso" || tipoReal === "salida"){
    const blob = await capturarFrameJPEG();
    fotoPath = await subirFoto(blob, dni, tipoReal);
    if(!fotoPath){
      mostrarFeedback("No se pudo tomar la foto de evidencia. Intenta de nuevo.", "error");
      procesando = false; stableDni = null; stableCount = 0;
      camFrameWrap.hidden = false; resultCard.hidden = true;
      return;
    }
  }
  const geo = await obtenerGeo();
  const { data, error } = await sb.rpc("asis_marcar", {
    p_dni: dni, p_tipo: tipoReal, p_lat: geo.lat, p_lng: geo.lng,
    p_dispositivo: DISPOSITIVO, p_foto_path: fotoPath,
  });
  if(error){
    mostrarFeedback(humanError(error), "error");
    setTimeout(volverAInicio, RESET_DESPUES_MS);
    return;
  }
  mostrarFeedback(`✅ ${TIPO_LABEL[tipoReal]} registrado — ${fmtHora(data.registrado_en)}`, "success");
  vibrarConfirmacion();
  setTimeout(volverAInicio, RESET_DESPUES_MS);
}

function volverAInicio(){
  cerrarScan();
}

document.getElementById("btn-home-ingreso").addEventListener("click", () => abrirScan("ingreso"));
document.getElementById("btn-home-almuerzo").addEventListener("click", () => abrirScan("almuerzo"));
document.getElementById("btn-home-salida").addEventListener("click", () => abrirScan("salida"));
document.getElementById("btn-scan-cancel").addEventListener("click", volverAInicio);

/* ---------------- Registro biometrico (enrolamiento) ---------------- */
const enrollModal = document.getElementById("enroll-modal");
const enrollCamSlot = document.getElementById("enroll-cam-slot");
const enrollDni = document.getElementById("enroll-dni");
const enrollBuscarBtn = document.getElementById("enroll-buscar");
const enrollInfo = document.getElementById("enroll-info");
const enrollCapturarBtn = document.getElementById("enroll-capturar");
const enrollStatus = document.getElementById("enroll-status");
let enrollEmpleado = null;

document.getElementById("btn-enroll-open").addEventListener("click", async () => {
  enrollModal.classList.add("show");
  enrollEmpleado = null;
  enrollDni.value = "";
  enrollInfo.textContent = "";
  enrollStatus.textContent = "";
  enrollCapturarBtn.disabled = true;
  enrollCamSlot.hidden = true;
});
document.getElementById("enroll-cerrar").addEventListener("click", () => {
  enrollModal.classList.remove("show");
  detenerCamara();
});

enrollBuscarBtn.addEventListener("click", async () => {
  const dni = enrollDni.value.trim();
  if(!dni){ enrollInfo.textContent = "Ingresa un DNI."; return; }
  enrollInfo.textContent = "Buscando…";
  enrollCapturarBtn.disabled = true;
  const { data, error } = await sb.rpc("asis_buscar_dni", { p_dni: dni });
  if(error){
    enrollEmpleado = null;
    enrollInfo.textContent = humanError(error);
    return;
  }
  enrollEmpleado = data;
  const empleadoLabel = `${data.nombre} — ${[data.puesto, data.area].filter(Boolean).join(" · ")}`;
  enrollInfo.textContent = empleadoLabel;
  try{
    if(!modelosListos){
      enrollInfo.textContent = empleadoLabel + " · Cargando modelos de reconocimiento…";
      await cargarModelos();
    }
    enrollInfo.textContent = empleadoLabel + " · Solicitando acceso a la cámara…";
    await iniciarCamara();
    dibujarCaja(null); // óvalo guía limpio
    enrollCamSlot.hidden = false;
    enrollCamSlot.appendChild(camUnit);
    camUnit.hidden = false;
    enrollInfo.textContent = empleadoLabel;
    enrollCapturarBtn.disabled = false;
  }catch(err){
    console.error(err);
    enrollInfo.textContent = empleadoLabel + " · No se pudo iniciar la cámara: " + (err && err.message ? err.message : err);
  }
});

enrollCapturarBtn.addEventListener("click", async () => {
  if(!enrollEmpleado) return;
  enrollCapturarBtn.disabled = true;
  const muestras = [];
  for(let i = 0; i < ENROLL_SAMPLES; i++){
    enrollStatus.className = "enroll-status";
    enrollStatus.textContent = `Capturando muestra ${i+1}/${ENROLL_SAMPLES}… mira a la cámara.`;
    const det = await detectarUnaVez();
    if(!det){
      dibujarCaja(null);
      enrollStatus.className = "enroll-status bad";
      enrollStatus.textContent = "No se detectó un rostro. Acércate a la cámara e inténtalo de nuevo.";
      enrollCapturarBtn.disabled = false;
      return;
    }
    dibujarCaja(det.detection.box, "#16A34A");
    muestras.push(Array.from(det.descriptor));
    await new Promise(r => setTimeout(r, 400));
  }
  const promedio = muestras[0].map((_, i) => muestras.reduce((s, m) => s + m[i], 0) / muestras.length);

  enrollStatus.className = "enroll-status";
  enrollStatus.textContent = "Guardando foto de referencia…";
  const fotoBlob = await capturarFrameJPEG();
  const fotoPath = await subirFoto(fotoBlob, enrollEmpleado.dni, "biometrico");

  const { error } = await sb.rpc("asis_rostros_enrolar", {
    p_dni: enrollEmpleado.dni, p_nombre: enrollEmpleado.nombre, p_embedding: promedio, p_foto_path: fotoPath,
  });
  if(error){
    enrollStatus.className = "enroll-status bad";
    enrollStatus.textContent = humanError(error);
    enrollCapturarBtn.disabled = false;
    return;
  }
  await cargarRostros();
  enrollStatus.className = "enroll-status ok";
  enrollStatus.textContent = `Rostro de ${enrollEmpleado.nombre} enrolado correctamente.`;
  enrollCapturarBtn.disabled = false;
});

/* ---------------- Arranque ---------------- */
async function main(){
  try{
    await cargarModelos();
    await cargarRostros();
  }catch(err){
    console.error(err);
  }
}
main();
